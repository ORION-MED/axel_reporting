<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <style>
      .t{font-family:Segoe UI,Arial,sans-serif;fill:#17324d}
      .h{font-size:22px;font-weight:700}
      .s{font-size:15px}
      .box{fill:#ffffff;stroke:#8bb0cc;stroke-width:2}
      .arr{stroke:#5b7c99;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#5b7c99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="#f6fbf7"/>
  <text x="40" y="48" class="t h">Путь пользователя: раздел Публикации</text>

  <rect class="box" x="40" y="90" width="220" height="190" rx="12"/>
  <text x="60" y="128" class="t s">1. Выбор режима</text>
  <text x="60" y="156" class="t s">• Общие</text>
  <text x="60" y="182" class="t s">• Мои работы</text>

  <rect class="box" x="320" y="90" width="240" height="190" rx="12"/>
  <text x="340" y="128" class="t s">2. Поиск и фильтр</text>
  <text x="340" y="156" class="t s">• Поиск по названию</text>
  <text x="340" y="182" class="t s">• Фильтр по тегам</text>

  <rect class="box" x="620" y="90" width="240" height="190" rx="12"/>
  <text x="640" y="128" class="t s">3. Карточка публикации</text>
  <text x="640" y="156" class="t s">• Клик по карточке</text>
  <text x="640" y="182" class="t s">→ загрузка в Рабочее место</text>

  <rect class="box" x="920" y="90" width="240" height="190" rx="12"/>
  <text x="940" y="128" class="t s">4. Действия автора</text>
  <text x="940" y="156" class="t s">• Опубликовать</text>
  <text x="940" y="182" class="t s">• Снять с публикации</text>
  <text x="940" y="208" class="t s">• Удалить</text>

  <path class="arr" d="M260,185 L320,185"/>
  <path class="arr" d="M560,185 L620,185"/>
  <path class="arr" d="M860,185 L920,185"/>
</svg>