<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .t{font-family:Segoe UI,Arial,sans-serif;fill:#17324d}
      .h{font-size:24px;font-weight:700}
      .s{font-size:16px}
      .l{stroke:#5b7c99;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#5b7c99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="#f4f8fc"/>
  <text x="40" y="50" class="t h">Схема интерфейса</text>

  <rect x="30" y="80" width="230" height="390" rx="12" fill="#e3eef9" stroke="#9ab6d2"/>
  <text x="50" y="120" class="t s">Боковое меню</text>
  <text x="50" y="150" class="t s">• Публикации</text>
  <text x="50" y="180" class="t s">• Рабочее место</text>
  <text x="50" y="210" class="t s">• Визуализация</text>
  <text x="50" y="240" class="t s">• Статистика</text>
  <text x="50" y="270" class="t s">• Базы данных</text>

  <rect x="290" y="80" width="880" height="70" rx="12" fill="#ffffff" stroke="#9ab6d2"/>
  <text x="320" y="123" class="t s">Верхняя панель: кнопка ? (справка) и иконка профиля</text>

  <rect x="290" y="170" width="880" height="300" rx="12" fill="#ffffff" stroke="#9ab6d2"/>
  <text x="320" y="210" class="t s">Рабочая область выбранной страницы</text>
  <text x="320" y="242" class="t s">Здесь отображаются таблицы, карточки публикаций, графики и фильтры</text>

  <path class="l" d="M260,140 C275,140 275,130 290,130"/>
  <path class="l" d="M260,250 C275,250 275,220 320,220"/>
</svg>