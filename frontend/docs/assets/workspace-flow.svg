<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .t{font-family:Segoe UI,Arial,sans-serif;fill:#17324d}
      .h{font-size:22px;font-weight:700}
      .s{font-size:15px}
      .box{fill:#ffffff;stroke:#8bb0cc;stroke-width:2}
      .arr{stroke:#5b7c99;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#5b7c99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="400" fill="#f5f7ff"/>
  <text x="40" y="48" class="t h">Путь пользователя: раздел Рабочее место</text>

  <rect class="box" x="40" y="90" width="210" height="220" rx="12"/>
  <text x="60" y="128" class="t s">1. Загрузка файла</text>
  <text x="60" y="156" class="t s">CSV/XLS/XLSX</text>

  <rect class="box" x="290" y="90" width="210" height="220" rx="12"/>
  <text x="310" y="128" class="t s">2. Работа с вкладками</text>
  <text x="310" y="156" class="t s">выбор активной таблицы</text>

  <rect class="box" x="540" y="90" width="210" height="220" rx="12"/>
  <text x="560" y="128" class="t s">3. Обработка данных</text>
  <text x="560" y="156" class="t s">фильтры и операции</text>

  <rect class="box" x="790" y="90" width="170" height="220" rx="12"/>
  <text x="810" y="128" class="t s">4. Сохранить</text>
  <text x="810" y="156" class="t s">как публикацию</text>

  <rect class="box" x="1000" y="90" width="170" height="220" rx="12"/>
  <text x="1020" y="128" class="t s">5. Экспорт</text>
  <text x="1020" y="156" class="t s">CSV или Excel</text>

  <path class="arr" d="M250,200 L290,200"/>
  <path class="arr" d="M500,200 L540,200"/>
  <path class="arr" d="M750,200 L790,200"/>
  <path class="arr" d="M960,200 L1000,200"/>
</svg>