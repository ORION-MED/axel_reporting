upstream backend_upstream {
    server backend:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 1g;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed static assets (JS/CSS bundles from Vite) — cache forever
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeout for large DB exports
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached so SPA updates are picked up immediately
        add_header Cache-Control        "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options      "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection     "1; mode=block" always;
    }
}
