services:
  # В серверном режиме наружу должны смотреть только reverse proxy/Nginx.
  # Все сервисные порты привязаны к localhost, чтобы БД, MinIO и RabbitMQ
  # не были доступны из интернета напрямую.
  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  app-db:
    ports:
      - "127.0.0.1:5433:5432"

  eicu-db:
    ports:
      - "127.0.0.1:5434:5432"

  mimic-db:
    ports:
      - "127.0.0.1:5435:5432"

  pic-db:
    ports:
      - "127.0.0.1:5436:5432"

  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
